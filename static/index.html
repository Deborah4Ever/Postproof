<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Postproof</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔍</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #0c0d12;
    --card-bg: #151720;
    --card-border: rgba(255, 255, 255, 0.06);
    --card-border-hover: rgba(255, 255, 255, 0.11);
    --card-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.4), 0 2px 6px -1px rgba(0, 0, 0, 0.25);
    --card-shadow-hover: 0 6px 24px -2px rgba(0, 0, 0, 0.5), 0 2px 8px -1px rgba(0, 0, 0, 0.3);

    --input-bg: #0a0b0f;
    --input-border: rgba(255, 255, 255, 0.09);
    --input-border-focus: #4ade80;
    --input-focus-shadow: 0 0 0 2px rgba(74, 222, 128, 0.18);

    --text: #f1f2f6;
    --text-muted: #94a3b8;
    --text-quiet: #64748b;
    --accent: #4ade80;
    --accent-hover: #3ecc72;
    --accent-ink: #05230c;

    /* Status washes: low-opacity wash paired with a harmonious lighter tone
       from the exact same hue family for dark-mode contrast. Never flat solid white/black text. */
    --real-bg: rgba(74, 222, 128, 0.12);
    --real-border: rgba(74, 222, 128, 0.22);
    --real-text: #6ee7b7;
    --real-dot: #34d399;

    --suspicious-bg: rgba(251, 191, 36, 0.12);
    --suspicious-border: rgba(251, 191, 36, 0.22);
    --suspicious-text: #fcd34d;
    --suspicious-dot: #fbbf24;

    --ghost-bg: rgba(248, 113, 113, 0.12);
    --ghost-border: rgba(248, 113, 113, 0.22);
    --ghost-text: #fca5a5;
    --ghost-dot: #f87171;
  }

  * { box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    max-width: 720px;
    margin: 48px auto;
    padding: 0 16px 64px;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* Title reads as a quiet wordmark */
  h1 {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-quiet);
    margin: 0 0 32px;
  }

  .zone {
    margin-bottom: 40px;
  }
  .zone:last-child {
    margin-bottom: 0;
  }

  .section-label {
    color: var(--text-quiet);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 12px;
  }

  /* --- check form: elevated surface card --- */
  .check-form {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 12px;
    box-shadow: var(--card-shadow);
  }
  .check-form input {
    width: 100%;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    color: var(--text);
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 14px;
    font-family: inherit;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
    outline: none;
  }
  .check-form input:focus {
    border-color: var(--input-border-focus);
    box-shadow: var(--input-focus-shadow);
  }
  .check-form input::placeholder {
    color: var(--text-quiet);
  }
  #url-input {
    margin-bottom: 12px;
  }
  .fields-row {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
  }
  .fields-row input {
    font-size: 13px;
    padding: 10px 14px;
  }
  .check-form button {
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    border-radius: 8px;
    padding: 10px 24px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s ease, opacity 0.15s ease, transform 0.05s ease;
  }
  .check-form button:hover:not(:disabled) {
    background: var(--accent-hover);
  }
  .check-form button:active:not(:disabled) {
    transform: scale(0.99);
  }
  .check-form button:disabled {
    opacity: 0.6;
    cursor: default;
  }
  .form-error {
    margin-top: 14px;
    color: var(--ghost-text);
    font-size: 13px;
    background: var(--ghost-bg);
    border: 1px solid var(--ghost-border);
    border-radius: 8px;
    padding: 12px 14px;
    line-height: 1.4;
  }

  /* --- trial counter + key gate --- */
  .trial-counter {
    color: var(--text-quiet);
    font-size: 12px;
    font-weight: 500;
    padding-left: 4px;
    display: flex;
    align-items: center;
  }
  .disconnect-key-btn {
    background: none;
    border: none;
    color: var(--text-quiet);
    font-size: 11px;
    font-weight: 500;
    font-family: inherit;
    text-decoration: underline;
    cursor: pointer;
    margin-left: 6px;
    padding: 0;
    transition: color 0.15s ease;
  }
  .disconnect-key-btn:hover {
    color: var(--ghost-text);
  }
  .trial-gate {
    margin-top: 16px;
    background: var(--suspicious-bg);
    border: 1px solid var(--suspicious-border);
    border-radius: 10px;
    padding: 16px;
  }
  .trial-gate-msg {
    color: var(--suspicious-text);
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 12px;
    line-height: 1.4;
  }
  .trial-gate input {
    margin-bottom: 12px;
  }
  .trial-gate button {
    background: var(--suspicious-dot);
    color: #241d02;
    border: none;
    border-radius: 8px;
    padding: 10px 22px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
    transition: opacity 0.15s ease;
  }
  .trial-gate button:disabled {
    opacity: 0.6;
    cursor: default;
  }

  /* --- cost number: the clear visual hero --- */
  .cost-label {
    color: var(--text-quiet);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 8px;
  }
  .cost {
    font-size: 48px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: -0.02em;
    line-height: 1.05;
    font-variant-numeric: tabular-nums;
  }

  /* --- results: elevated card rows --- */
  .results-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .results-empty {
    color: var(--text-quiet);
    font-size: 13px;
    padding: 16px 0;
  }

  .result-row {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 16px 18px;
    box-shadow: var(--card-shadow);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .result-row:hover {
    border-color: var(--card-border-hover);
    box-shadow: var(--card-shadow-hover);
  }
  .result-main {
    display: flex;
    align-items: flex-start;
    gap: 14px;
  }
  .result-body {
    flex: 1 1 auto;
    min-width: 0;
  }
  .result-title {
    font-weight: 600;
    font-size: 14px;
    color: var(--text);
    line-height: 1.35;
  }
  .result-company {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 2px;
  }
  .result-summary {
    font-size: 12px;
    color: var(--text-quiet);
    margin-top: 6px;
    line-height: 1.45;
  }

  .result-toggle {
    flex: 0 0 auto;
    background: none;
    border: none;
    color: var(--text-quiet);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    padding: 4px 6px;
    font-family: inherit;
    border-radius: 4px;
    transition: color 0.15s ease;
  }
  .result-toggle:hover {
    color: var(--text);
  }

  .result-details {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--card-border);
  }
  .result-details[hidden] {
    display: none;
  }
  .evidence {
    margin: 0;
    padding-left: 18px;
  }
  .evidence li {
    margin-bottom: 6px;
    line-height: 1.45;
    color: #cbd5e1;
    font-size: 13px;
  }
  .evidence li:last-child {
    margin-bottom: 0;
  }
  .detail-contact {
    margin-top: 10px;
    font-size: 12px;
    color: var(--text-quiet);
  }

  /* --- verdict pill badges --- */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.02em;
    white-space: nowrap;
    margin-top: 1px;
    border: 1px solid transparent;
  }
  .badge .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex: 0 0 auto;
  }
  .badge.real {
    background: var(--real-bg);
    color: var(--real-text);
    border-color: var(--real-border);
  }
  .badge.real .dot {
    background: var(--real-dot);
  }
  .badge.suspicious {
    background: var(--suspicious-bg);
    color: var(--suspicious-text);
    border-color: var(--suspicious-border);
  }
  .badge.suspicious .dot {
    background: var(--suspicious-dot);
  }
  .badge.ghost {
    background: var(--ghost-bg);
    color: var(--ghost-text);
    border-color: var(--ghost-border);
  }
  .badge.ghost .dot {
    background: var(--ghost-dot);
  }
</style>
</head>
<body>
  <h1>Postproof</h1>

  <div class="zone">
    <div class="check-form">
      <input id="url-input" type="text" placeholder="Paste a job posting URL, or enter title + company below" />
      <div class="fields-row">
        <input id="company-input" type="text" placeholder="Company" />
        <input id="title-input" type="text" placeholder="Title" />
      </div>
      <button id="check-btn">Check this posting</button>
      <div id="form-error" class="form-error" hidden></div>
      <div id="trial-gate" class="trial-gate" hidden>
        <div class="trial-gate-msg" id="trial-gate-msg">Free trial used up (2 checks) - connect your own Monid key to continue</div>
        <input id="user-key-input" type="password" placeholder="Connect your Monid API key to continue" />
        <button id="continue-key-btn">Continue with my key</button>
      </div>
    </div>
    <div class="trial-counter" id="trial-counter"></div>
  </div>

  <div class="zone">
    <div class="cost-label">Real Monid spend so far (measured, not estimated)</div>
    <div class="cost" id="cost">$0.0000</div>
  </div>

  <div class="zone">
    <div class="section-label">Recent checks</div>
    <div class="results-list" id="rows"></div>
  </div>

<script>
function escapeHtml(str) {
  if (str == null) return '';
  return String(str)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#39;');
}

function extractErrorMessage(data) {
  if (!data) return 'Something went wrong.';
  if (typeof data.detail === 'string') return data.detail;
  if (Array.isArray(data.detail) && data.detail[0] && data.detail[0].msg) return data.detail[0].msg;
  return 'Something went wrong.';
}

function truncate(str, maxLen) {
  if (!str) return '';
  const s = String(str);
  if (s.length <= maxLen) return s;
  const cut = s.slice(0, maxLen);
  const lastSpace = cut.lastIndexOf(' ');
  return (lastSpace > 20 ? cut.slice(0, lastSpace) : cut).trimEnd() + '…';
}

function summaryLine(r) {
  const bits = (r.evidence || []).slice(0, 2).map(e => truncate(e, 60));
  if (typeof r.check_cost_usd === 'number') {
    bits.push(`cost $${r.check_cost_usd.toFixed(4)}`);
  }
  return bits.join(' · ');
}

function capitalize(str) {
  if (!str) return '';
  return str.charAt(0).toUpperCase() + str.slice(1);
}

// Rows are rebuilt from scratch every poll, so track which ones the user
// has expanded (by stable index into the underlying /results array) and
// restore that state - otherwise an open detail panel would slam shut
// every 4 seconds mid-read.
const expandedRows = new Set();

async function refresh() {
  const cost = await (await fetch('/cost')).json();
  document.getElementById('cost').textContent = '$' + cost.total_measured_cost_usd.toFixed(4);

  const results = await (await fetch('/results')).json();
  const rows = document.getElementById('rows');
  rows.innerHTML = '';

  if (results.length === 0) {
    rows.innerHTML = '<div class="results-empty">No checks yet.</div>';
    return;
  }

  const indexed = results.map((r, i) => ({ r, i }));
  indexed.reverse();

  for (const { r, i } of indexed) {
    const key = String(i);
    const isOpen = expandedRows.has(key);
    const confidence = typeof r.confidence === 'number' ? ` · ${r.confidence.toFixed(2)}` : '';
    const evidenceItems = (r.evidence || []).map(e => `<li>${escapeHtml(e)}</li>`).join('');

    const row = document.createElement('div');
    row.className = 'result-row';
    row.innerHTML = `
      <div class="result-main">
        <span class="badge ${r.verdict}"><span class="dot"></span>${capitalize(escapeHtml(r.verdict))}${confidence}</span>
        <div class="result-body">
          <div class="result-title">${escapeHtml(r.title)}</div>
          <div class="result-company">${escapeHtml(r.company)}</div>
          <div class="result-summary">${escapeHtml(summaryLine(r))}</div>
        </div>
        <button class="result-toggle" data-key="${key}" aria-expanded="${isOpen}">${isOpen ? 'Hide details' : 'Details'}</button>
      </div>
      <div class="result-details" ${isOpen ? '' : 'hidden'}>
        <ul class="evidence">${evidenceItems}</ul>
        <div class="detail-contact">${r.contact ? 'Contact found' : 'No contact found'}</div>
      </div>
    `;
    rows.appendChild(row);
  }
}

document.getElementById('rows').addEventListener('click', (e) => {
  const btn = e.target.closest('.result-toggle');
  if (!btn) return;
  const row = btn.closest('.result-row');
  const details = row.querySelector('.result-details');
  const key = btn.dataset.key;
  const willOpen = details.hidden;
  details.hidden = !willOpen;
  btn.setAttribute('aria-expanded', String(willOpen));
  btn.textContent = willOpen ? 'Hide details' : 'Details';
  if (willOpen) expandedRows.add(key); else expandedRows.delete(key);
});

const urlInput = document.getElementById('url-input');
const companyInput = document.getElementById('company-input');
const titleInput = document.getElementById('title-input');
const checkBtn = document.getElementById('check-btn');
const formError = document.getElementById('form-error');
const trialCounter = document.getElementById('trial-counter');
const trialGate = document.getElementById('trial-gate');
const trialGateMsg = document.getElementById('trial-gate-msg');
const userKeyInput = document.getElementById('user-key-input');
const continueKeyBtn = document.getElementById('continue-key-btn');

// In-memory only for this page session - NEVER written to localStorage,
// sessionStorage, or any persistent storage. A shared/public machine
// would otherwise keep the visitor's key around after they leave.
let userMonidKey = null;
let lastPayload = null;

function requestHeaders() {
  const headers = { 'Content-Type': 'application/json' };
  if (userMonidKey) headers['X-User-Monid-Key'] = userMonidKey;
  return headers;
}

let currentTrial = { checks_used: 0, cap: 2 };

function renderTrialCounter(checksUsed, cap, flashMsg) {
  if (checksUsed !== undefined && cap !== undefined) {
    currentTrial = { checks_used: checksUsed, cap: cap };
  }
  if (userMonidKey) {
    trialCounter.innerHTML = `Connected with your own Monid key <button type="button" class="disconnect-key-btn" id="disconnect-key-btn">Disconnect key</button>`;
  } else {
    const mainText = `${currentTrial.checks_used} of ${currentTrial.cap} free checks used`;
    trialCounter.textContent = flashMsg ? `${flashMsg} (${mainText})` : mainText;
  }
}

trialCounter.addEventListener('click', (e) => {
  if (e.target && e.target.id === 'disconnect-key-btn') {
    userMonidKey = null;
    if (currentTrial.checks_used >= currentTrial.cap) {
      showTrialGate('Free trial used up (2 checks) - connect your own Monid key to continue');
    } else {
      hideTrialGate();
    }
    renderTrialCounter(currentTrial.checks_used, currentTrial.cap, 'Key removed.');
  }
});

async function loadTrialStatus() {
  try {
    const status = await (await fetch('/trial-status')).json();
    renderTrialCounter(status.checks_used, status.cap);
  } catch (err) {
    // non-fatal - counter just stays blank
  }
}

function showTrialGate(message) {
  if (message) trialGateMsg.textContent = message;
  trialGate.hidden = false;
  checkBtn.hidden = true;
}

function hideTrialGate() {
  trialGate.hidden = true;
  checkBtn.hidden = false;
}

async function submitCheck(payload) {
  formError.hidden = true;
  formError.textContent = '';

  checkBtn.disabled = true;
  const originalLabel = checkBtn.textContent;
  checkBtn.textContent = 'Checking…';

  try {
    const resp = await fetch('/check-job', {
      method: 'POST',
      headers: requestHeaders(),
      body: JSON.stringify(payload),
    });
    const data = await resp.json();

    if (resp.status === 402 && data.error === 'trial_exhausted') {
      lastPayload = payload;
      showTrialGate(data.message);
      renderTrialCounter(data.checks_used, 2);
      return;
    }
    if (!resp.ok) {
      throw new Error(extractErrorMessage(data));
    }

    hideTrialGate();
    if (data.trial) renderTrialCounter(data.trial.checks_used, data.trial.cap);
    urlInput.value = '';
    companyInput.value = '';
    titleInput.value = '';
    lastPayload = null;
    await refresh();
  } catch (err) {
    formError.textContent = err.message;
    formError.hidden = false;
  } finally {
    checkBtn.disabled = false;
    checkBtn.textContent = originalLabel;
  }
}

checkBtn.addEventListener('click', async () => {
  const url = urlInput.value.trim();
  const company = companyInput.value.trim();
  const title = titleInput.value.trim();

  let payload;
  if (url) {
    payload = { url };
  } else if (title && company) {
    payload = { title, company };
  } else {
    formError.textContent = 'Provide a URL, or both a title and a company.';
    formError.hidden = false;
    return;
  }

  await submitCheck(payload);
});

continueKeyBtn.addEventListener('click', async () => {
  const key = userKeyInput.value.trim();
  if (!key) return;
  userMonidKey = key;
  userKeyInput.value = '';
  hideTrialGate();
  renderTrialCounter(currentTrial.checks_used, currentTrial.cap);
  if (lastPayload) {
    await submitCheck(lastPayload);
  }
});

loadTrialStatus();
refresh();
setInterval(refresh, 4000);
</script>
</body>
</html>
